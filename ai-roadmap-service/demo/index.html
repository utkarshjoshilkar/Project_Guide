<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Project Guide AI</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <header>

    <h1>🚀 Project Guide AI</h1>

    <h2 id="projectTitle">
        Project Roadmap Viewer
    </h2>

    <p>
        AI Powered Learning Roadmap Viewer
    </p>

    <button id="loadRoadmapBtn">

        🔄 Load Latest Roadmap

    </button>

</header>

    <main id="roadmapContent">

        <div class="empty-state">

            <h2>No Roadmap Loaded</h2>

            <p>

                Generate a roadmap from Swagger,
                then click

                <strong>Load Latest Roadmap</strong>

            </p>

        </div>

    </main>

</div>

<script src="js/script.js"></script>

</body>

</html>
