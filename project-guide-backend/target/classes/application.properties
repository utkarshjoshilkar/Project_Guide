# =============================================================================
# application.properties — Common configuration (all profiles)
# =============================================================================
# Profile-specific overrides are in:
#   application-dev.properties  (local development)
#   application-prod.properties (production)
#
# Active profile is set via: SPRING_PROFILES_ACTIVE=dev (or prod)
# =============================================================================

# Load .env file for local development (ignored if absent in production)
spring.config.import=optional:file:.env[.properties]

# ── Datasource ─────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Disable open-in-view to avoid lazy-load surprises outside transactions
spring.jpa.open-in-view=false

# ── JWT ────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── AI Roadmap Microservice ─────────────────────────────────────────────────
# Override via AI_SERVICE_URL env var (e.g. http://ai-service:8000 in Docker)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_READ_TIMEOUT_MS:60000}

# ── CORS ───────────────────────────────────────────────────────────────────
# Comma-separated list of allowed frontend origins
# Override in production with your actual domain(s)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://localhost:5173}
