# =============================================================================
# application-test.properties — Isolated test profile (H2 in-memory)
# =============================================================================
# Activated by @ActiveProfiles("test") on @SpringBootTest classes.
#
# Design intent:
#   Replace all external dependencies (MySQL, .env secrets) with in-memory
#   equivalents so the Spring context loads without any running services.
#
# Property override order (highest wins):
#   System env vars > application-test.properties > .env (via import) > application.properties
#
# Note on spring.config.import:
#   application.properties contains:
#     spring.config.import=optional:file:.env[.properties]
#   That import fires when application.properties is loaded, BEFORE this file
#   is read. Setting spring.config.import= here prevents any *additional* imports
#   from this profile but does not suppress the base import that has already run.
#   This is safe because:
#     (a) the import is optional: — a missing .env is silently ignored, and
#     (b) every property set below has higher precedence than .env values,
#         so even if .env exists locally, its DB_URL/JWT_SECRET/etc. are
#         overridden by the explicit values in this file.
spring.config.import=

# ── Datasource: H2 in-memory ─────────────────────────────────────────────────
# Overrides: spring.datasource.url=${DB_URL}, driver, username, password
#
# MODE=MySQL     — makes H2 accept MySQL DDL syntax (TEXT columns, etc.)
# DB_CLOSE_DELAY=-1 — keeps the in-memory DB alive for the full JVM session
# DATABASE_TO_LOWER=TRUE — table names treated case-insensitively, matching
#                          @Table(name = "users") entity declarations
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Explicitly set dialect so Hibernate 6 does not attempt MySQL dialect detection.
# create-drop: Hibernate creates the schema from entities on startup and drops
# it on shutdown — correct for a stateless in-memory test database.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#
# globally_quoted_identifiers: wraps every table/column name in double-quotes
# in Hibernate-generated DDL (e.g.  year  →  "year").
# Required because H2 2.x treats YEAR as a reserved keyword and rejects it as an
# unquoted column name.  This is safe with H2's MODE=MySQL.
# Scope: test only — this property is NOT present in application.properties.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# Overrides: jwt.secret=${JWT_SECRET}  (no default in application.properties)
#
# Keys.hmacShaKeyFor() requires >= 256 bits = 32 bytes = 32 ASCII characters.
# This value is 48 characters (384 bits) — safely above the HMAC-SHA256 minimum.
# NEVER use this value outside of tests.
jwt.secret=test-only-secret-key-not-for-production-48chars
jwt.expiration-ms=86400000

# ── AI microservice ───────────────────────────────────────────────────────────
# FastAPI is never contacted at context startup (no @PostConstruct HTTP calls).
# The stub URL below makes it obvious this is a test-only config and prevents
# any accidental call from reaching a real service.
ai.service.url=http://localhost:9999
ai.service.connect-timeout-ms=1000
ai.service.read-timeout-ms=5000
