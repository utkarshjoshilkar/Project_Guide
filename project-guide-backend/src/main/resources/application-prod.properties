# =============================================================================
# application-prod.properties — Production profile
# =============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST come from environment variables — never hardcode.
# =============================================================================

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# validate: verifies schema matches entities at startup — NEVER modifies schema in prod.
# Run Flyway or Liquibase migrations separately before deploying.
spring.jpa.hibernate.ddl-auto=validate

# Never log SQL in production (performance + security)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Connection Pool (HikariCP) ──────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Logging ─────────────────────────────────────────────────────────────────
# Reduce noise in production — WARN for third-party, INFO for our code
logging.level.root=WARN
logging.level.com.studentguide=INFO

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
