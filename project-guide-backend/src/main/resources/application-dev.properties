# =============================================================================
# application-dev.properties — Local development profile
# =============================================================================
# Activate with: SPRING_PROFILES_ACTIVE=dev  (or set in IDE run config)
# =============================================================================

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
# update: auto-creates and alters tables — safe for local dev
spring.jpa.hibernate.ddl-auto=update

# Log SQL for debugging — do NOT enable in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Connection Pool (HikariCP) ──────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
