# Load .env file for local development (ignored if not present)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true



spring.jpa.open-in-view=false


# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# AI Roadmap Microservice
# Override in .env for a different environment (e.g. Docker: http://ai-service:8000)
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# RestTemplate timeouts for FastAPI calls
# connect-timeout: max time (ms) to open a TCP connection to FastAPI
# read-timeout:    max time (ms) to wait for Gemini AI response (60s — AI generation is slow)
ai.service.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_READ_TIMEOUT_MS:60000}
